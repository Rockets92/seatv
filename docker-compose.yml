# Avvio: docker compose up -d  (le impostazioni in .env, vedi deploy/env.example)
services:
  seatv:
    build: .
    image: seatv
    restart: unless-stopped
    env_file: .env
    environment:
      SEATV_DB_PATH: /data/seatv.sqlite3
      SEATV_SCHEDULER: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - seatv-data:/data

volumes:
  seatv-data:
