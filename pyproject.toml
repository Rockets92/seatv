[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seatv"
version = "0.1.0"
description = "Web API con la guida TV (EPG) dei canali italiani del digitale terrestre e del satellite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Avvio sotto Phusion Passenger (passenger_wsgi.py).
plesk = ["a2wsgi>=1.10"]

[tool.setuptools.packages.find]
include = ["seatv*"]

[tool.setuptools.package-data]
seatv = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
