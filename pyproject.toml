[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seatv"
version = "0.2.0"
description = "Guida TV (EPG) dei canali italiani del digitale terrestre e del satellite: feed XMLTV, API JSON e pagina web statici"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[tool.setuptools.packages.find]
include = ["seatv*"]

[tool.setuptools.package-data]
seatv = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
